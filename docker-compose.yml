services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zgrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env -- see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-zgrader}
    # Bound to the host's loopback, not 0.0.0.0: this exists so the test suite
    # can reach a scratch database (zgrader_test) over an SSH tunnel, not so
    # the database is reachable from the LAN. Exposing 5432 on the network
    # with the default zgrader/zgrader credentials would be a considerably
    # worse trade than the convenience is worth.
    #
    # Reach it with:  ssh -N -L 5432:127.0.0.1:5432 <this-host>
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      #- postgres_data:/var/lib/postgresql/data
      - ${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zgrader}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment: &backend-env
      # Turns on the startup checks that refuse shipped-default secrets, and
      # switches off the interactive API docs. The app will not boot in
      # production until ZGRADER_SECRET_KEY and POSTGRES_PASSWORD are real.
      ZGRADER_ENV: ${ZGRADER_ENV:-production}
      ZGRADER_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zgrader}:${POSTGRES_PASSWORD:?set a real password in .env -- see .env.example}@postgres:5432/${POSTGRES_DB:-zgrader}
      ZGRADER_SCANS_DIR: /data/scans
      ZGRADER_REPORTS_DIR: /data/reports
      ZGRADER_SECRET_KEY: ${ZGRADER_SECRET_KEY:?set a real random value in .env -- see .env.example}
      # Origin used to build the links in verification and password-reset
      # emails. It has to be the address the customer's browser can reach --
      # behind Cloudflare that's your public hostname, not a container name.
      ZGRADER_SITE_URL: ${ZGRADER_SITE_URL:-http://localhost:8080}
      ZGRADER_DEFAULT_SCAN_DPI: ${ZGRADER_DEFAULT_SCAN_DPI:-600}
      ZGRADER_ADMIN_EMAIL: ${ZGRADER_ADMIN_EMAIL:-}
      ZGRADER_ADMIN_PASSWORD: ${ZGRADER_ADMIN_PASSWORD:-}
      # Locked-out recovery: forces the password above onto the account on the
      # next start. Set true, redeploy, log in, set it back to false.
      ZGRADER_ADMIN_RESET_PASSWORD: ${ZGRADER_ADMIN_RESET_PASSWORD:-false}
      # Google sign-in. Leave both blank to keep it switched off; the button
      # only appears when the backend reports it configured.
      ZGRADER_GOOGLE_CLIENT_ID: ${ZGRADER_GOOGLE_CLIENT_ID:-}
      ZGRADER_GOOGLE_CLIENT_SECRET: ${ZGRADER_GOOGLE_CLIENT_SECRET:-}
      ZGRADER_AI_ENABLED: ${ZGRADER_AI_ENABLED:-false}
      ZGRADER_AI_ENDPOINT: ${ZGRADER_AI_ENDPOINT:-}
      ZGRADER_AI_MODEL: ${ZGRADER_AI_MODEL:-}
      ZGRADER_SMTP_HOST: ${ZGRADER_SMTP_HOST:-mailhog}
      ZGRADER_SMTP_PORT: ${ZGRADER_SMTP_PORT:-1025}
      ZGRADER_SMTP_USER: ${ZGRADER_SMTP_USER:-}
      ZGRADER_SMTP_PASSWORD: ${ZGRADER_SMTP_PASSWORD:-}
      ZGRADER_SMTP_FROM: ${ZGRADER_SMTP_FROM:-noreply@zgrader.local}
      ZGRADER_SMTP_USE_TLS: ${ZGRADER_SMTP_USE_TLS:-false}
      ZGRADER_SMTP_IMPLICIT_TLS: ${ZGRADER_SMTP_IMPLICIT_TLS:-false}
      # How many analyses may run inside API requests at once. confirm-crop
      # runs the OpenCV pipeline in the request, so without this a burst of
      # submissions saturates the API and everything sharing the box with it.
      # The worker adds one more on top of this.
      ZGRADER_MAX_CONCURRENT_ANALYSES: ${ZGRADER_MAX_CONCURRENT_ANALYSES:-2}
      # Threads each analysis may use. Without it the cap above limits how many
      # analyses run while each still spreads across every core.
      ZGRADER_ANALYSIS_THREADS: ${ZGRADER_ANALYSIS_THREADS:-2}
      # NumPy's bundled OpenBLAS is a second thread pool that ignores the
      # setting above, and it reads these before the app gets a say -- they
      # have to be real environment variables, not ZGRADER_ settings, because
      # they are consumed at numpy import time. Kept equal to
      # ZGRADER_ANALYSIS_THREADS so one number describes the machine's share.
      OMP_NUM_THREADS: ${ZGRADER_ANALYSIS_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${ZGRADER_ANALYSIS_THREADS:-2}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - ${SCANS_HOST_PATH:-./data/scans}:/data/scans
      - ${REPORTS_DATA_PATH:-reports_data}:/data/reports
      #- ${SCANS_HOST_PATH:-./data/scans}:/data/scans
      #- reports_data:/data/reports
    #ports:
    #  - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m zgrader.worker.main
    environment: *backend-env
    volumes:
      - ${SCANS_HOST_PATH:-./data/scans}:/data/scans
      - ${REPORTS_DATA_PATH:-reports_data}:/data/reports
      #- ${SCANS_HOST_PATH:-./data/scans}:/data/scans
      #- reports_data:/data/reports
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    #ports:
    #  - "3000:3000"
    depends_on:
      - backend

  # Local SMTP catcher for dev/testing so notification emails have somewhere
  # to go without configuring a real mail relay. Web UI at localhost:8025.
  # For a real deployment, point ZGRADER_SMTP_* at your own relay instead and
  # this service is unnecessary (just don't start it).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "8025:8025"
    profiles:
      - dev

  # Nightly dump of the database, the reports directory and the scans
  # directory. All three, because only the first is in Postgres -- a
  # database-only backup restores rows pointing at files that no longer exist.
  #
  # Built from postgres:16 (see infra/backup/Dockerfile) rather than pulling it
  # and bind-mounting the script in. The mount version failed whenever the
  # script was momentarily absent at container start: Docker creates a missing
  # bind source as a *directory*, so the container died with "is a directory:
  # permission denied" and the stray directory then shadowed the real script.
  # Baked in, a missing script is a build failure that names the file.
  #
  # pg_dump must match the database's major version or it refuses to run, which
  # is why the base image is pinned to the same tag as the postgres service
  # above. Upgrading one means upgrading both.
  #
  # Reads reports and scans READ-ONLY. A backup process with write access to
  # the thing it is protecting is one bug away from being the disaster.
  #
  # See docs/backup.md for the restore drill. An untested backup is a belief,
  # not a backup.
  backup:
    build: ./infra/backup
    restart: unless-stopped
    # Unraid's nobody:users, matching backend/Dockerfile's APP_UID/APP_GID, so
    # the dumps land owned by the same account as everything else in appdata
    # and stay readable and deletable from the host.
    user: "${APP_UID:-99}:${APP_GID:-100}"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zgrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env -- see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-zgrader}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ${BACKUP_HOST_PATH:-./data/backups}:/backups
      - ${REPORTS_DATA_PATH:-reports_data}:/data/reports:ro
      - ${SCANS_HOST_PATH:-./data/scans}:/data/scans:ro
    depends_on:
      postgres:
        condition: service_healthy

  # The public entry point for the reference deployment. Dials *out* to
  # Cloudflare, so no router port is forwarded and the home IP is never
  # published. Point the tunnel's public hostname at http://caddy:80 -- being
  # in this stack, it reaches Caddy over the Docker network and needs no host
  # port at all.
  #
  # Deliberately NOT behind a compose profile, unlike mailhog. A profile was
  # tried first, to keep a fresh clone starting with no tunnel token -- but
  # Portainer's stack deployment does not reliably honour COMPOSE_PROFILES, so
  # the service simply never appeared and the only symptom was Cloudflare
  # error 1033 (DNS points at a tunnel, nothing connected to it). "Silently
  # absent" is a much worse failure than "running without a token", and this is
  # the reference deployment's front door rather than an optional extra.
  #
  # With no token set, cloudflared logs the missing credential and restarts.
  # If you are not fronting this with a tunnel, delete this service.
  #
  # Two of the app's controls assume this is the ONLY route in, so do not also
  # port-forward 8080 -- see docs/deployment.md. The backend trusts
  # CF-Connecting-IP for rate limiting, which anyone reaching the origin
  # directly could forge; and HSTS is served with a two-year preload max-age,
  # which would lock browsers out of a plain-HTTP origin.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    command: caddy reverse-proxy --from :80 --to frontend:3000
      #- "443:443"
    #volumes:
     # - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
     # - caddy_data:/data
     # - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  reports_data:
  caddy_data:
  caddy_config:
